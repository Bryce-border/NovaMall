server:
  port: 8081
spring:
  application:
    name: mall-auth
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
security:
  jwt:
    secret: ${JWT_SECRET:nova-mall-local-secret-key-change-before-production}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  pattern:
    level: "%5p [traceId:%X{traceId}]"
