server:
  port: 8080

spring:
  application:
    name: mall-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      routes:
        - id: mall-auth
          uri: lb://mall-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        - id: mall-user
          uri: lb://mall-user
          predicates:
            - Path=/api/users/**
        - id: mall-product
          uri: lb://mall-product
          predicates:
            - Path=/api/products/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
        - id: mall-category
          uri: lb://mall-product
          predicates:
            - Path=/api/categories/**
        - id: mall-inventory
          uri: lb://mall-inventory
          predicates:
            - Path=/api/inventory/**
        - id: mall-order
          uri: lb://mall-order
          predicates:
            - Path=/api/orders/**,/api/coupons/**,/api/reviews/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        - id: mall-seckill
          uri: lb://mall-inventory
          predicates:
            - Path=/api/seckill/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1

security:
  jwt:
    secret: ${JWT_SECRET:nova-mall-local-secret-key-change-before-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
