<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e2231a">
  <title>NovaMall · 网上商城</title>
  <link rel="stylesheet" href="./shop.css?v=20261010-coupons-2">
  <script src="./shop.js?v=20261010-coupons-2" defer></script>
</head>
<body>
  <div class="utility-bar"><div class="utility-inner"><a href="#catalog">商城首页</a><span class="utility-welcome">欢迎来到网上商城</span><div id="account" class="account"></div><a href="#orders">我的订单</a><a href="#addresses">收货地址</a><a href="#admin">商家工作台</a></div></div>
  <header class="site-header">
    <div class="search-row"><div class="site-caption"><strong>Novamall 网上商城</strong><span>手机数码 · 品质生活</span></div><div class="search-center"><form class="header-search" id="global-search-form" role="search"><input type="search" name="q" aria-label="搜索商品" placeholder="搜索商品，例如 iPhone 17 Pro" maxlength="128"><button type="submit">搜索</button></form><div class="search-suggestions"><span>热门搜索</span><a href="#catalog?q=iPhone">iPhone</a><a href="#catalog?q=手机">手机</a><a href="#catalog?q=耳机">耳机</a><a href="#catalog?q=电脑">电脑</a></div></div><a class="header-cart" href="#cart"><span aria-hidden="true">&#128722;</span> 我的购物车 <span aria-hidden="true">›</span></a></div>
    <nav aria-label="主导航" class="main-nav">
      <details class="nav-categories" id="nav-categories"><summary>全部商品分类 <span>⌄</span></summary><div id="nav-category-links"><a href="#catalog">全部商品</a></div></details>
      <a href="#catalog" data-nav="catalog">商城首页</a>
      <a href="#catalog" id="digital-nav">手机数码</a>
      <a href="#cart" data-nav="cart">购物车</a>
      <a href="#orders" data-nav="orders">我的订单</a>
      <a href="#admin" data-nav="admin" id="admin-nav" hidden>商品管理</a>
      <a href="#coupons" data-nav="coupons">券券宝</a><a href="#wallet" data-nav="wallet">我的优惠券</a>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer><div class="footer-links"><a href="#catalog">商品浏览</a><a href="#cart">购物车</a><a href="#orders">订单中心</a><a href="#addresses">地址管理</a><a href="#admin">管理员入口</a><a href="./sources.html" target="_blank" rel="noopener">商品图片来源</a></div></footer>
  <button class="floating-cart-button" id="floating-cart-button" data-action="toggle-cart" aria-controls="cart-popover" aria-expanded="false" aria-label="打开购物车"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 3h3l3 13h11l3-9H6M9 21h.01M18 21h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="cart-badge">购物车</span></button>
  <section id="cart-popover" class="cart-popover" role="dialog" aria-label="购物车预览" hidden></section>
  <button class="back-top" id="back-top" data-action="back-top" aria-label="返回顶部" hidden>↑<span>顶部</span></button>
  <dialog id="workspace-dialog" class="workspace-dialog" aria-labelledby="workspace-title"><button type="button" class="dialog-close" data-action="close-workspace" aria-label="关闭窗口">×</button><div id="workspace-content"></div></dialog>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="auth-dialog" aria-labelledby="auth-title">
    <button type="button" class="dialog-close" data-action="close-auth" aria-label="关闭登录窗口">×</button>
    <div class="eyebrow">账号中心</div>
    <h2 id="auth-title">账号登录</h2>
    <p class="muted">登录后可使用购物车、收货地址和订单服务。</p>
    <form id="auth-form">
      <label>用户名<input name="username" required minlength="3" maxlength="32" autocomplete="username" placeholder="你的用户名"></label>
      <label>密码<input name="password" type="password" required maxlength="64" autocomplete="current-password" placeholder="输入密码"></label>
      <label id="nickname-field" hidden>昵称<input name="nickname" maxlength="64" autocomplete="nickname" placeholder="怎么称呼你"></label>
      <p id="auth-error" class="form-error" role="alert"></p>
      <button class="button primary full" type="submit" id="auth-submit">登录</button>
    </form>
    <button type="button" class="text-button full" data-action="toggle-auth" id="auth-toggle">还没有账号？注册一个</button>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <div class="eyebrow">操作确认</div>
    <h2 id="confirm-title">确认操作</h2>
    <p id="confirm-message"></p>
    <form method="dialog" class="button-row"><button class="button" value="cancel" autofocus>返回</button><button class="button primary" value="confirm">确认</button></form>
  </dialog>
</body>
</html>
